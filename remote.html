<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tournament Remote">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Tournament Remote | Uno Club</title>
  <meta name="description" content="Uno Club Tournament Remote controls.">
  <link rel="apple-touch-icon" href="./tournament-remote-icon.png">
  <link rel="icon" type="image/png" href="./tournament-remote-icon.png">
  <link rel="stylesheet" href="./styles.css?v=0.3.42">
</head>
<body>
  <div id="app"><div class="boot"><strong>UNO CLUB</strong><p>Opening Tournament Remote…</p></div></div>
  <div class="remote-version-launcher" aria-label="App version" style="position:fixed;left:16px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));z-index:5;font:11px/16px system-ui,sans-serif;color:#8794a6;opacity:.85;pointer-events:none">v0.3.42</div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="./app.js?v=0.3.42"></script>
<script>
  // Keep the displayed release number consistent across both entry points.
  (() => {
    const updateVersion = () => {
      document.querySelectorAll('.app-footer span').forEach(el => {
        if (el.textContent.includes('v0.3.41')) el.textContent = el.textContent.replace('v0.3.41', 'v0.3.42');
      });
      if (new URLSearchParams(location.search).get('view') === 'remote' &&
          !document.querySelector('.remote-version, .remote-version-launcher')) {
        const label = document.createElement('div');
        label.className = 'remote-version-launcher';
        label.textContent = 'v0.3.42';
        label.setAttribute('aria-label', 'App version');
        label.style.cssText = 'position:fixed;left:16px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));z-index:5;font:11px/16px system-ui,sans-serif;color:#8794a6;opacity:.85;pointer-events:none';
        document.body.appendChild(label);
      }
    };
    const observer = new MutationObserver(updateVersion);
    observer.observe(document.getElementById('app'), {childList:true,subtree:true});
    updateVersion();
  })();
</script>
</body>
</html>
