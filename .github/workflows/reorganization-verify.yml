name: Reorganization Phase Verification
on:
  push:
    branches:
      - Reorganization
  workflow_dispatch:
concurrency:
  group: reorganization-build
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Reorganization
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run all automated tests
        run: npm test
      - name: Build modular website
        run: npm run build
      - name: Check generated JavaScript
        run: |
          node --check dist/app.js
          find dist/chunks -type f -name '*.js' -print -exec node --check '{}' \;
          test -f dist/app.js
          test -n "$(find dist/chunks -name '*.js' -print -quit)"
          grep -q '0.4.0-reorg.36' version.json
      - name: Publish verified build files only to Reorganization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html styles.css chunks/
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified reorganization build on Reorganization"
            git fetch origin Reorganization
            git rebase origin/Reorganization
            git push origin HEAD:Reorganization
          fi
