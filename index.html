<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#060f18"><title>Uno Club Tournament Director</title><meta name="description" content="Your tournament, under control. Saved structures, player sign-up, phone controls, and a dedicated TV clock."><link rel="apple-touch-icon" sizes="180x180" href="./tournament-remote-icon.png?v=0.4.0-reorg.45"><link rel="icon" type="image/png" href="./tournament-remote-icon.png?v=0.4.0-reorg.45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Tournament Remote"><link rel="stylesheet" href="./styles.css?v=0.4.0-reorg.45"></head><body><div id="app"><div class="boot"><strong>UNO CLUB</strong><p>Opening Tournament Director…</p></div></div><div id="toast" role="status" aria-live="polite"></div><dialog id="dialog"></dialog><script type="module" src="./app.js?v=0.4.0-reorg.45"></script><script>
  // Keep the displayed release number consistent across both entry points.
  (() => {
    const updateVersion = () => {
      document.querySelectorAll('.app-footer span').forEach(el => {
        const updated = el.textContent.replace(/v0\.3\.\d+/g, 'v0.4.0-reorg.45');
        if (updated !== el.textContent) el.textContent = updated;
      });
      if (new URLSearchParams(location.search).get('view') === 'remote' &&
          !document.querySelector('.remote-version, .remote-version-launcher')) {
        const label = document.createElement('div');
        label.className = 'remote-version-launcher';
        label.textContent = 'v0.4.0-reorg.45';
        label.setAttribute('aria-label', 'App version');
        label.style.cssText = 'position:fixed;left:16px;bottom:calc(8px + env(safe-area-inset-bottom, 0px));z-index:5;font:11px/16px system-ui,sans-serif;color:#8794a6;opacity:.85;pointer-events:none';
        document.body.appendChild(label);
      }
    };
    const observer = new MutationObserver(updateVersion);
    observer.observe(document.getElementById('app'), {childList:true,subtree:true});
    updateVersion();
  })();
</script>
<style>
#clock-main.remote-action-red{background:#b33434;border-color:#b33434;color:white}
#clock-main.remote-action-green{background:#21794a;border-color:#21794a;color:white}
</style>
<script>
(() => {
 const update=()=>{
  const button=document.getElementById('clock-main');
  if(!button)return;
  const action=button.getAttribute('data-clock');
  button.classList.toggle('remote-action-red',action==='pause');
  button.classList.toggle('remote-action-green',action==='resume');
  button.classList.toggle('primary',action==='start');
  const label=action==='pause'?'Pause Clock':action==='resume'?'Resume Clock':action==='start'?'Start Tournament':null;
  if(label!==null&&button.textContent!==label)button.textContent=label;
 };
 const root=document.getElementById('app');
 new MutationObserver(update).observe(root,{subtree:true,childList:true,attributes:true,attributeFilter:['data-clock']});
 update();
})();
</script>
<script>
/* Published-version checker. Unlike GitHub commit metadata, version.json
   is served by the same host as the running website. */
(() => {
 const current='0.4.0-reorg.45';
 const compare=(a,b)=>{const p=v=>String(v).match(/\d+/g)?.map(Number)||[];const x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)-(y[i]||0)}return 0};
 let busy=false,last=0;
 const safe=()=>!document.querySelector('#clock-main[data-clock="pause"]')&&new URLSearchParams(location.search).get('view')!=='clock';
 const status=(msg)=>{const e=document.querySelector('#published-release-status');if(e)e.textContent=msg};
 function refresh(){const u=new URL(location.href);u.searchParams.set('appv',String(Date.now()));location.replace(u.href)}
 async function check(manual=false){
  if(busy||(!manual&&(document.hidden||Date.now()-last<60000)))return;
  busy=true;last=Date.now();status('Checking published version…');
  try{
   const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
   if(!response.ok)throw Error('Version file unavailable');
   const data=await response.json();
   if(!/^\d+\.\d+\.\d+-reorg\.\d+$/.test(data.version))throw Error('Invalid release information');
   const published=data.version;
   if(compare(published,current)>0){status('Published v'+published+' available'+(safe()?' — updating…':' — close active clock to update'));if(safe())refresh();}
   else if(compare(published,current)<0)status('Published: v'+published+' · Installed: v'+current+' (website deployment still behind)');
   else status('Published and installed: v'+current);
  }catch(err){status('Cannot check published version; check connection');}
  finally{busy=false}
 }
 function install(){
  const footer=document.querySelector('.app-footer');
  if(!footer||document.querySelector('#published-release-status'))return;
  const wrap=document.createElement('span');wrap.className='release-checker';
  wrap.innerHTML='<button type="button" class="button secondary small" id="check-published-release">Check for Update</button><small id="published-release-status" aria-live="polite">Published version not checked</small>';
  footer.append(wrap);wrap.querySelector('button').addEventListener('click',()=>check(true));
  check(true);
 }
 new MutationObserver(install).observe(document.getElementById('app'),{childList:true,subtree:true});
 install();
 window.addEventListener('pageshow',()=>check());
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
 window.addEventListener('online',()=>check());
 setInterval(()=>check(),5*60*1000);
})();
</script>
<script>
/* Keep the dedicated TV clock awake when the browser and OS allow it. */
(() => {
  if (new URLSearchParams(location.search).get('view') !== 'clock') return;
  let lock = null;
  let pending = false;
  const acquire = async () => {
    if (document.visibilityState !== 'visible' || lock || pending || !navigator.wakeLock?.request) return;
    pending = true;
    try {
      const requested = await navigator.wakeLock.request('screen');
      lock = requested;
      requested.addEventListener('release', () => {
        if (lock === requested) lock = null;
      }, {once:true});
    } catch (_) {
      // Browser, OS, or battery policy may deny wake lock; clock remains usable.
    } finally {
      pending = false;
    }
  };
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) acquire();
  });
  window.addEventListener('focus', acquire);
  window.addEventListener('pageshow', acquire);
  window.addEventListener('pagehide', () => {
    const current = lock;
    lock = null;
    if (current) current.release().catch(() => {});
  });
  acquire();
})();
</script>
